<html lang="ru">
<head>

  <title>Open Sites</title>
  <meta name="description" content="Тестовый сайт на GitHub Pages">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">GitHub Pages</p>
